<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kasse" />
  <meta name="theme-color" content="#34495e" />
  <link rel="manifest" href="manifest.json" />
  <title>Kassen-App</title>
  <style>
    :root {
      --primary: #34495e;
      --accent:  #2ecc71;
      --bg:      #f0f2f5;
      --text:    #2c3e50;
      --card:    #ffffff;
      --border:  #e2e8f0;
      --sidebar: #dde3ec;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── HEADER ── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 6px;
    }
    header h1 { font-size: 1rem; white-space: nowrap; }
    .nav-tabs { display: flex; gap: 4px; }
    .tab-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.78rem;
    }
    .tab-btn.active { background: var(--accent); }
    .header-actions { display: flex; gap: 4px; }
    .icon-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      width: 32px; height: 32px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── TABS ── */
    .tab-content { display: none; flex: 1; overflow: hidden; }
    .tab-content.active { display: flex; flex-direction: column; }
    #pos-tab { flex-direction: row !important; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 80px;
      background: var(--sidebar);
      border-right: 1px solid #c5cdd8;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .category-btn {
      width: 100%;
      padding: 12px 6px;
      text-align: center;
      background: transparent;
      border: none;
      border-bottom: 1px solid #c5cdd8;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      word-break: break-word;
      line-height: 1.2;
    }
    .category-btn.active {
      background: var(--card);
      border-left: 3px solid var(--primary);
      color: var(--primary);
    }

    /* ── GRID ── */
    .main-grid {
      flex: 1;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      align-content: start;
      overflow-y: auto;
    }
    @media (min-width: 380px) {
      .main-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .item-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      min-height: 80px;
      transition: transform 0.08s;
      -webkit-touch-callout: none;
    }
    .item-card:active { transform: scale(0.95); }
    .item-name  { font-weight: 700; font-size: 0.82rem; line-height: 1.2; }
    .item-price { font-size: 0.75rem; color: #666; margin-top: 3px; }
    .item-badge {
      position: absolute;
      top: -9px; right: -9px;
      background: #e53e3e;
      color: #fff;
      border-radius: 50%;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.75rem;
    }

    /* ── FOOTER ── */
    footer {
      background: #fff;
      border-top: 2px solid #c5cdd8;
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .total-box {
      background: #dde3ec;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      text-align: center;
      border: 2px solid var(--primary);
    }
    .btn-clear {
      background: #e53e3e;
      color: #fff;
      border: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /* ── HISTORY ── */
    #history-tab { padding: 12px; overflow-y: auto; flex-direction: column !important; gap: 8px; }
    #history-tab h2 { margin-bottom: 6px; font-size: 1rem; }
    .history-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
    }
    .history-item strong { display: block; margin-bottom: 3px; }
    .history-item small { color: #666; }

    /* ── SETUP ── */
    #setup-tab { padding: 12px; overflow-y: auto; flex-direction: column !important; gap: 12px; }
    .setup-section {
      background: #fff;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .setup-section h2 { margin-bottom: 10px; font-size: 0.95rem; }
    .form-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: flex-end; }
    input[type="text"], input[type="number"], select {
      padding: 7px 9px;
      border: 1px solid #c5cdd8;
      border-radius: 5px;
      font-size: 0.85rem;
      background: #fff;
      -webkit-appearance: none;
    }
    input[type="text"]   { min-width: 100px; flex: 1; }
    input[type="number"] { width: 80px; }
    .btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /* ── FARB-SWATCHES ── */
    .color-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0 10px;
    }
    .color-swatch {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .color-swatch.selected {
      border-color: var(--primary);
      transform: scale(1.2);
    }

    /* ── ARTIKEL-KARTEN (Setup) ── */
    .item-entry {
      background: #f8f9fa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .item-entry-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .item-entry-info { flex: 1; min-width: 0; }
    .item-entry-name {
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-entry-meta { font-size: 0.75rem; color: #666; margin-top: 2px; }
    .item-entry-color {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 1px solid #ccc;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .item-entry-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-edit {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-del {
      background: #fee2e2;
      color: #e53e3e;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ── INLINE-EDIT FORMULAR ── */
    .item-edit-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .item-edit-form.open { display: flex; }
    .edit-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .edit-row input, .edit-row select {
      flex: 1;
      min-width: 80px;
    }
    .edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .btn-save {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-cancel-edit {
      background: #e2e8f0;
      border: none;
      padding: 7px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* ── KATEGORIEN-TABELLE ── */
    .cat-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #f8f9fa;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    /* ── CHECKOUT MODAL ── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: #fff;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
    }
    .modal-content h2 { margin-bottom: 10px; font-size: 1rem; }
    .modal-total {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 14px;
      text-align: center;
    }
    .modal-content label { font-size: 0.8rem; color: #555; display: block; margin-bottom: 4px; }
    .modal-content input[type="number"] {
      width: 100%;
      font-size: 1.6rem;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #c5cdd8;
      border-radius: 8px;
      text-align: center;
    }
    .cash-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .cash-btn {
      padding: 11px 4px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }
    .btn-5e  { background: #79a1cb; }
    .btn-10e { background: #e67e22; }
    .btn-20e { background: #3498db; }
    .btn-50e { background: #f1c40f; color: #2c3e50; }
    .change-output {
      padding: 12px;
      background: #edf2f7;
      border-radius: 6px;
      font-size: 1.3rem;
      font-weight: 700;
      border-left: 4px solid var(--accent);
      margin-bottom: 14px;
      text-align: center;
    }
    .modal-actions { display: flex; gap: 8px; }
    .btn-cancel  {
      background: #e2e8f0;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex: 1;
    }
    .btn-confirm {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      flex: 2;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: calc(70px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2c3e50;
      color: #fff;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 2000;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Kasse</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="pos">Kasse</button>
      <button class="tab-btn" data-tab="history">Historie</button>
      <button class="tab-btn" data-tab="setup">⚙️</button>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-export" title="Export">📤</button>
      <button class="icon-btn" id="btn-import" title="Import">📥</button>
      <input type="file" id="importFile" accept=".json" style="display:none" />
    </div>
  </header>

  <!-- KASSE -->
  <div id="pos-tab" class="tab-content active">
    <div class="sidebar" id="categories-list"></div>
    <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <div class="main-grid" id="items-grid"></div>
      <footer>
        <button class="btn-clear" id="btn-clear">🗑 Leeren</button>
        <div class="total-box" id="total-display">Zwischensumme: 0,00 €</div>
      </footer>
    </div>
  </div>

  <!-- HISTORIE -->
  <div id="history-tab" class="tab-content">
    <h2>Bestellhistorie</h2>
    <div id="history-list"></div>
  </div>

  <!-- EINSTELLUNGEN -->
  <div id="setup-tab" class="tab-content">

    <div class="setup-section">
      <h2>Kategorien</h2>
      <div class="form-row">
        <input type="text" id="new-cat-name" placeholder="z.B. Softdrinks" />
        <button class="btn-add" id="btn-add-cat">+ Hinzufügen</button>
      </div>
      <div id="setup-categories-list"></div>
    </div>

    <div class="setup-section">
      <h2>Artikel hinzufügen</h2>
      <p style="font-size:0.75rem;color:#666;margin-bottom:8px;">Minusbeträge für Rückgabe erlaubt.</p>
      <div class="form-row">
        <select id="item-cat-select" style="flex:1;min-width:80px;"></select>
        <input type="text"   id="item-name"  placeholder="Name" />
      </div>
      <div class="form-row">
        <input type="number" id="item-price" step="0.01" placeholder="Preis (€)" />
        <input type="number" id="item-pfand" step="0.01" placeholder="Pfand (€)" value="0" />
      </div>
      <div class="color-picker" id="add-color-picker"></div>
      <input type="hidden" id="item-color" value="#ffffff" />
      <button class="btn-add" id="btn-add-item" style="width:100%;">+ Artikel hinzufügen</button>
    </div>

    <div class="setup-section">
      <h2>Artikel verwalten</h2>
      <div id="setup-items-list"></div>
    </div>

  </div>

  <!-- CHECKOUT MODAL -->
  <div class="modal" id="checkout-modal">
    <div class="modal-content">
      <h2>Abrechnung</h2>
      <div class="modal-total" id="modal-total-payable">0,00 €</div>
      <label>Gegeben (€)</label>
      <input type="number" id="amount-received" step="0.01" min="0" placeholder="0,00" />
      <div class="cash-presets">
        <button class="cash-btn btn-5e"  data-amount="5">5 €</button>
        <button class="cash-btn btn-10e" data-amount="10">10 €</button>
        <button class="cash-btn btn-20e" data-amount="20">20 €</button>
        <button class="cash-btn btn-50e" data-amount="50">50 €</button>
      </div>
      <div class="change-output">Rückgeld: <span id="change-display">0,00 €</span></div>
      <div class="modal-actions">
        <button class="btn-cancel"  id="btn-cancel-checkout">Abbrechen</button>
        <button class="btn-confirm" id="btn-confirm-checkout">✅ Abschließen</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ── FARBEN ──────────────────────────────────────────────────────────────
    const COLORS = [
      { hex: "#ffffff", label: "Weiß" },
      { hex: "#f1f5f9", label: "Hellgrau" },
      { hex: "#e2e8f0", label: "Grau" },
      { hex: "#fee2e2", label: "Hellrot" },
      { hex: "#fecaca", label: "Rosa-Rot" },
      { hex: "#fed7aa", label: "Lachs" },
      { hex: "#fde68a", label: "Hellgelb" },
      { hex: "#fef9c3", label: "Creme" },
      { hex: "#d1fae5", label: "Mintgrün" },
      { hex: "#a7f3d0", label: "Grün" },
      { hex: "#99f6e4", label: "Türkis" },
      { hex: "#bfdbfe", label: "Hellblau" },
      { hex: "#93c5fd", label: "Blau" },
      { hex: "#c4b5fd", label: "Lila" },
      { hex: "#f5d0fe", label: "Violett" },
      { hex: "#fbcfe8", label: "Pink" },
      { hex: "#fde8d8", label: "Apricot" },
      { hex: "#ecfccb", label: "Lindgrün" },
      { hex: "#e0f2fe", label: "Eisblau" },
      { hex: "#f0fdf4", label: "Mintweiss" },
    ];

    function buildColorPicker(containerId, hiddenId, selectedHex) {
      const container = document.getElementById(containerId);
      const hidden    = document.getElementById(hiddenId);
      container.innerHTML = "";
      COLORS.forEach(c => {
        const sw = document.createElement("div");
        sw.className = "color-swatch" + (c.hex === selectedHex ? " selected" : "");
        sw.style.background = c.hex;
        sw.title = c.label;
        sw.addEventListener("click", () => {
          container.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
          sw.classList.add("selected");
          hidden.value = c.hex;
        });
        container.appendChild(sw);
      });
      hidden.value = selectedHex || "#ffffff";
    }

    // ── STATE ────────────────────────────────────────────────────────────────
    const DEFAULT_DATA = {
      categories: ["Ausschankwagen", "Bar", "Pfandrückgabe", "Eintritt"],
      items: [
        { id: 1, cat: "Ausschankwagen",      name: "Bier 0,5l",         price:  3.00, pfand: 1.00, color: "#fffb0071" },
        { id: 2, cat: "Ausschankwagen",      name: "Weizen 0,5l",       price:  3.50, pfand: 1.00, color: "#3eba00" },
        { id: 3, cat: "Ausschankwagen",      name: "Helles 0,5l",       price:  3.50, pfand: 1.00, color: "#00c4de" },
        { id: 4, cat: "Ausschankwagen",      name: "Weinschorle",       price:  6.00, pfand: 1.00, color: "#11ff00" },
        { id: 5, cat: "Ausschankwagen",      name: "Aperol",            price:  6.00, pfand: 1.00, color: "#ff8400" },
        { id: 6, cat: "Ausschankwagen",      name: "Sati",              price:  6.00, pfand: 1.00, color: "#fb00ff" },
        { id: 7, cat: "Ausschankwagen",      name: "Cola",              price:  2.50, pfand: 1.00, color: "#2a0000" },
        { id: 8, cat: "Ausschankwagen",      name: "Spezi",             price:  2.50, pfand: 1.00, color: "#664d4d" },
        { id: 9, cat: "Ausschankwagen",      name: "Fanta",             price:  2.50, pfand: 1.00, color: "#fbff00" },
        { id: 10, cat: "Ausschankwagen",     name: "Wasser",            price:  2.50, pfand: 1.00, color: "#0004ff" },

        { id: 11, cat: "Bar",                name: "Becher groß",       price:  8.00, pfand: 1.00, color: "#2000be" },
        { id: 12, cat: "Bar",                name: "Shot/ Klopfer",     price:  1.00, pfand: 0.00, color: "#be0000" },
        { id: 13, cat: "Bar",                name: "Flyinghirsch",      price:  4.00, pfand: 0.00, color: "#00720a" },

        { id: 14, cat: "Pfandrückgabe",      name: "Pfand",             price: -1.00, pfand: 0.00, color: "#000000" },

        { id: 14, cat: "Eintritt",           name: "Eintritt",          price: 5.00,  pfand: 0.00, color: "#ffffff" }
      ],
      history: []
    };

    let appData       = JSON.parse(localStorage.getItem("kassenapp_data") || "null") || DEFAULT_DATA;
    let currentCart   = {};
    let activeCategory = appData.categories[0] || "";

    function saveData() { localStorage.setItem("kassenapp_data", JSON.stringify(appData)); }

    // ── TOAST ────────────────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    // ── TABS ─────────────────────────────────────────────────────────────────
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tab + "-tab").classList.add("active");
        btn.classList.add("active");
        if (tab === "pos")     renderPOS();
        if (tab === "setup")   renderSetup();
        if (tab === "history") renderHistory();
      });
    });

    // ── POS ──────────────────────────────────────────────────────────────────
    function renderPOS() {
      const catList = document.getElementById("categories-list");
      catList.innerHTML = "";
      appData.categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "category-btn" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat;
        btn.addEventListener("click", () => { activeCategory = cat; renderPOS(); });
        catList.appendChild(btn);
      });

      const grid = document.getElementById("items-grid");
      grid.innerHTML = "";
      appData.items.filter(i => i.cat === activeCategory).forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.style.backgroundColor = item.color || "#ffffff";
        const qty = currentCart[item.id] || 0;

        const nameEl  = document.createElement("div"); nameEl.className  = "item-name";  nameEl.textContent = item.name;
        const priceEl = document.createElement("div"); priceEl.className = "item-price";
        priceEl.textContent = item.price.toFixed(2) + " €" + (item.pfand > 0 ? " (+" + item.pfand.toFixed(2) + ")" : "");
        card.appendChild(nameEl);
        card.appendChild(priceEl);

        if (qty > 0) {
          const badge = document.createElement("div");
          badge.className = "item-badge";
          badge.textContent = qty;
          card.appendChild(badge);
        }

        let pressTimer = null;
        const startPress = () => { pressTimer = setTimeout(() => { pressTimer = null; changeQty(item.id, -1); }, 550); };
        const endPress   = () => { if (pressTimer !== null) { clearTimeout(pressTimer); pressTimer = null; changeQty(item.id, 1); } };
        card.addEventListener("mousedown",  startPress);
        card.addEventListener("mouseup",    endPress);
        card.addEventListener("mouseleave", () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
        card.addEventListener("touchstart", e => { e.preventDefault(); startPress(); }, { passive: false });
        card.addEventListener("touchend",   e => { e.preventDefault(); endPress();   }, { passive: false });
        grid.appendChild(card);
      });
      updateTotalDisplay();
    }

    function changeQty(itemId, delta) {
      currentCart[itemId] = (currentCart[itemId] || 0) + delta;
      if (currentCart[itemId] <= 0) delete currentCart[itemId];
      renderPOS();
    }

    function calculateTotal() {
      return Object.keys(currentCart).reduce((sum, id) => {
        const item = appData.items.find(i => i.id == id);
        return sum + (item ? (item.price + item.pfand) * currentCart[id] : 0);
      }, 0);
    }

    function fmt(n) {
      return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }

    function updateTotalDisplay() {
      document.getElementById("total-display").textContent = "Zwischensumme: " + fmt(calculateTotal());
    }

    document.getElementById("btn-clear").addEventListener("click", () => { currentCart = {}; renderPOS(); });
    document.getElementById("total-display").addEventListener("click", openCheckoutModal);

    // ── CHECKOUT ─────────────────────────────────────────────────────────────
    function openCheckoutModal() {
      const total = calculateTotal();
      if (total === 0) { showToast("Warenkorb ist leer!"); return; }
      document.getElementById("modal-total-payable").textContent = fmt(total);
      document.getElementById("amount-received").value = "";
      document.getElementById("change-display").textContent = "0,00 €";
      document.getElementById("checkout-modal").classList.add("open");
    }
    function closeCheckoutModal() { document.getElementById("checkout-modal").classList.remove("open"); }
    document.getElementById("btn-cancel-checkout").addEventListener("click", closeCheckoutModal);

    document.querySelectorAll(".cash-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.getElementById("amount-received").value = btn.dataset.amount;
        calculateChange();
      });
    });
    document.getElementById("amount-received").addEventListener("input", calculateChange);

    function calculateChange() {
      const total    = calculateTotal();
      const received = parseFloat(document.getElementById("amount-received").value) || 0;
      document.getElementById("change-display").textContent = fmt(Math.max(0, received - total));
    }

    document.getElementById("btn-confirm-checkout").addEventListener("click", () => {
      const total    = calculateTotal();
      const received = parseFloat(document.getElementById("amount-received").value) || 0;
      const summary  = Object.keys(currentCart).map(id => {
        const item = appData.items.find(i => i.id == id);
        return currentCart[id] + "x " + item.name;
      }).join(", ");
      appData.history.unshift({ timestamp: new Date().toLocaleString("de-DE"), items: summary, total, received, change: Math.max(0, received - total) });
      saveData(); currentCart = {}; closeCheckoutModal(); renderPOS();
      showToast("✅ Buchung gespeichert!");
    });

    // ── HISTORY ──────────────────────────────────────────────────────────────
    function renderHistory() {
      const container = document.getElementById("history-list");
      if (appData.history.length === 0) { container.innerHTML = "<p style='color:#888;'>Noch keine Buchungen.</p>"; return; }
      container.innerHTML = "";
      appData.history.forEach(tx => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = "<strong>📅 " + tx.timestamp + " — " + fmt(tx.total) + "</strong>" +
          "<div style='margin:3px 0'>" + tx.items + "</div>" +
          "<small>Gegeben: " + fmt(tx.received) + " | Rückgeld: " + fmt(tx.change) + "</small>";
        container.appendChild(div);
      });
    }

    // ── SETUP ────────────────────────────────────────────────────────────────
    function renderSetup() {
      // Kategorie-Select
      const sel = document.getElementById("item-cat-select");
      sel.innerHTML = "";
      appData.categories.forEach(c => {
        const o = document.createElement("option");
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });

      // Kategorien-Liste
      const catList = document.getElementById("setup-categories-list");
      catList.innerHTML = "";
      appData.categories.forEach((c, i) => {
        const div = document.createElement("div");
        div.className = "cat-entry";
        div.innerHTML = "<span>" + c + "</span>";
        const btn = document.createElement("button");
        btn.className = "btn-del";
        btn.textContent = "Löschen";
        btn.addEventListener("click", () => deleteCategory(i));
        div.appendChild(btn);
        catList.appendChild(div);
      });

      // Artikel-Liste als Cards
      const itemsList = document.getElementById("setup-items-list");
      itemsList.innerHTML = "";
      appData.items.forEach((item, i) => {
        const entry = document.createElement("div");
        entry.className = "item-entry";
        entry.id = "item-entry-" + i;

        // Header-Zeile
        const header = document.createElement("div");
        header.className = "item-entry-header";

        const colorDot = document.createElement("div");
        colorDot.className = "item-entry-color";
        colorDot.style.background = item.color || "#fff";

        const info = document.createElement("div");
        info.className = "item-entry-info";
        info.innerHTML =
          "<div class='item-entry-name'>" + item.cat + " – " + item.name + "</div>" +
          "<div class='item-entry-meta'>" + item.price.toFixed(2) + " € | Pfand: " + item.pfand.toFixed(2) + " €</div>";

        const actions = document.createElement("div");
        actions.className = "item-entry-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "btn-edit";
        editBtn.textContent = "✏️ Bearbeiten";
        editBtn.addEventListener("click", () => toggleEdit(i));

        const delBtn = document.createElement("button");
        delBtn.className = "btn-del";
        delBtn.textContent = "Löschen";
        delBtn.addEventListener("click", () => deleteItem(i));

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        header.appendChild(colorDot);
        header.appendChild(info);
        header.appendChild(actions);

        // Edit-Formular
        const form = document.createElement("div");
        form.className = "item-edit-form";
        form.id = "edit-form-" + i;

        const editColorHiddenId = "edit-color-" + i;
        const editColorPickerId = "edit-color-picker-" + i;

        form.innerHTML =
          "<div class='edit-row'>" +
            "<select id='edit-cat-" + i + "'>" +
              appData.categories.map(c => "<option value='" + c + "'" + (c === item.cat ? " selected" : "") + ">" + c + "</option>").join("") +
            "</select>" +
            "<input type='text' id='edit-name-" + i + "' value='" + item.name.replace(/'/g, "&#39;") + "' placeholder='Name' />" +
          "</div>" +
          "<div class='edit-row'>" +
            "<input type='number' id='edit-price-" + i + "' step='0.01' value='" + item.price + "' placeholder='Preis (€)' />" +
            "<input type='number' id='edit-pfand-" + i + "' step='0.01' value='" + item.pfand + "' placeholder='Pfand (€)' />" +
          "</div>" +
          "<div class='color-picker' id='" + editColorPickerId + "'></div>" +
          "<input type='hidden' id='" + editColorHiddenId + "' value='" + item.color + "' />" +
          "<div class='edit-actions'>" +
            "<button class='btn-cancel-edit' onclick='cancelEdit(" + i + ")'>Abbrechen</button>" +
            "<button class='btn-save' onclick='saveEdit(" + i + ")'>💾 Speichern</button>" +
          "</div>";

        entry.appendChild(header);
        entry.appendChild(form);
        itemsList.appendChild(entry);

        // Farbpalette für Edit-Form aufbauen
        buildColorPicker(editColorPickerId, editColorHiddenId, item.color || "#ffffff");
      });

      // Farbpalette für Hinzufügen aufbauen
      buildColorPicker("add-color-picker", "item-color", document.getElementById("item-color").value || "#ffffff");
    }

    function toggleEdit(i) {
      // Alle anderen schließen
      document.querySelectorAll(".item-edit-form").forEach((f, idx) => {
        if (idx !== i) f.classList.remove("open");
      });
      const form = document.getElementById("edit-form-" + i);
      form.classList.toggle("open");
    }

    function cancelEdit(i) {
      document.getElementById("edit-form-" + i).classList.remove("open");
    }

    function saveEdit(i) {
      const cat   = document.getElementById("edit-cat-"   + i).value;
      const name  = document.getElementById("edit-name-"  + i).value.trim();
      const price = parseFloat(document.getElementById("edit-price-" + i).value) || 0;
      const pfand = parseFloat(document.getElementById("edit-pfand-" + i).value) || 0;
      const color = document.getElementById("edit-color-" + i).value;
      if (!name) { showToast("Name darf nicht leer sein!"); return; }
      appData.items[i] = { ...appData.items[i], cat, name, price, pfand, color };
      saveData(); renderSetup();
      showToast("✅ Gespeichert!");
    }

    document.getElementById("btn-add-cat").addEventListener("click", () => {
      const name = document.getElementById("new-cat-name").value.trim();
      if (name && !appData.categories.includes(name)) {
        appData.categories.push(name);
        saveData(); renderSetup();
        document.getElementById("new-cat-name").value = "";
      }
    });

    function deleteCategory(i) {
      const name = appData.categories[i];
      appData.categories.splice(i, 1);
      appData.items = appData.items.filter(item => item.cat !== name);
      if (activeCategory === name) activeCategory = appData.categories[0] || "";
      saveData(); renderSetup();
    }

    document.getElementById("btn-add-item").addEventListener("click", () => {
      const cat   = document.getElementById("item-cat-select").value;
      const name  = document.getElementById("item-name").value.trim();
      const price = parseFloat(document.getElementById("item-price").value) || 0;
      const pfand = parseFloat(document.getElementById("item-pfand").value) || 0;
      const color = document.getElementById("item-color").value || "#ffffff";
      if (cat && name) {
        appData.items.push({ id: Date.now(), cat, name, price, pfand, color });
        saveData(); renderSetup();
        document.getElementById("item-name").value  = "";
        document.getElementById("item-price").value = "";
        document.getElementById("item-pfand").value = "0";
        showToast("Artikel hinzugefügt!");
      }
    });

    function deleteItem(i) { appData.items.splice(i, 1); saveData(); renderSetup(); }

    // ── EXPORT / IMPORT ──────────────────────────────────────────────────────
    document.getElementById("btn-export").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url;
      a.download = "kassenapp_" + new Date().toISOString().slice(0,10) + ".json";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("btn-import").addEventListener("click", () => {
      document.getElementById("importFile").click();
    });

    document.getElementById("importFile").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.categories && parsed.items) {
            appData = parsed;
            activeCategory = appData.categories[0] || "";
            saveData(); currentCart = {}; renderPOS();
            showToast("Import erfolgreich!");
          } else { showToast("Ungültige Datei!"); }
        } catch { showToast("Fehler beim Laden!"); }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    // ── SERVICE WORKER ───────────────────────────────────────────────────────
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    // ── INIT ─────────────────────────────────────────────────────────────────
    renderPOS();
  </script>
</body>
</html>
