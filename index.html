<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kasse" />
  <meta name="theme-color" content="#34495e" />
  <link rel="manifest" href="manifest.json" />
  <title>Kassen-App</title>
  <style>
    :root {
      --primary: #34495e;
      --accent:  #2ecc71;
      --bg:      #f8f9fa;
      --text:    #2c3e50;
      --card:    #ffffff;
      --border:  #e2e8f0;
      --sidebar: #edf2f7;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100dvh; display: flex; flex-direction: column;
      overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    header {
      background: var(--primary); color: #fff;
      padding: 10px 16px; display: flex;
      justify-content: space-between; align-items: center;
      flex-shrink: 0; gap: 8px;
    }
    header h1 { font-size: 1.1rem; white-space: nowrap; }
    .nav-tabs { display: flex; gap: 6px; }
    .tab-btn {
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      padding: 7px 13px; border-radius: 5px; cursor: pointer;
      font-weight: 600; font-size: 0.85rem; transition: background 0.15s;
    }
    .tab-btn.active { background: var(--accent); }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.6);
      color: #fff; padding: 6px 10px; border-radius: 5px;
      cursor: pointer; font-size: 0.8rem;
    }
    .tab-content { display: none; flex: 1; overflow: hidden; }
    .tab-content.active { display: flex; flex-direction: column; }
    #pos-tab { flex-direction: row !important; }
    .sidebar {
      width: 140px; background: var(--sidebar);
      border-right: 1px solid #cbd5e0; overflow-y: auto; flex-shrink: 0;
    }
    .category-btn {
      width: 100%; padding: 14px 12px; text-align: left;
      background: transparent; border: none; border-bottom: 1px solid #cbd5e0;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.1s;
    }
    .category-btn.active {
      background: var(--card); border-left: 4px solid var(--primary); padding-left: 8px;
    }
    .main-grid {
      flex: 1; padding: 12px;
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; align-content: start; overflow-y: auto;
    }
    .item-card {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 10px; padding: 12px;
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; cursor: pointer; min-height: 100px;
      transition: transform 0.08s, box-shadow 0.08s; -webkit-touch-callout: none;
    }
    .item-card:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .item-name { font-weight: 700; font-size: 0.95rem; line-height: 1.2; }
    .item-price { font-size: 0.85rem; color: #555; margin-top: 4px; }
    .item-badge {
      position: absolute; top: -10px; right: -10px;
      background: #e53e3e; color: #fff; border-radius: 50%;
      width: 26px; height: 26px; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 0.85rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    footer {
      background: #fff; border-top: 2px solid #cbd5e0;
      padding: 12px 16px; display: flex; justify-content: space-between;
      align-items: center; gap: 10px; flex-shrink: 0;
    }
    .total-box {
      background: #cbd5e0; padding: 12px 20px; border-radius: 8px;
      font-size: 1.3rem; font-weight: 700; cursor: pointer; flex: 1;
      text-align: center; border: 2px solid var(--primary); transition: background 0.15s;
    }
    .total-box:hover { background: #b2bec9; }
    .btn-clear {
      background: #e53e3e; color: #fff; border: none;
      padding: 12px 16px; border-radius: 8px; font-weight: 700;
      cursor: pointer; font-size: 0.9rem;
    }
    #history-tab {
      padding: 16px; overflow-y: auto;
      flex-direction: column !important; gap: 10px;
    }
    #history-tab h2 { margin-bottom: 8px; }
    .history-item {
      background: #fff; border: 1px solid var(--border);
      border-radius: 8px; padding: 14px;
    }
    .history-item strong { display: block; margin-bottom: 4px; }
    .history-item small { color: #666; }
    #setup-tab {
      padding: 16px; overflow-y: auto;
      flex-direction: column !important; gap: 16px;
    }
    .setup-section {
      background: #fff; padding: 16px;
      border-radius: 10px; border: 1px solid var(--border);
    }
    .setup-section h2 { margin-bottom: 12px; font-size: 1rem; }
    .form-row {
      display: flex; flex-wrap: wrap;
      gap: 8px; margin-bottom: 12px; align-items: flex-end;
    }
    input[type="text"], input[type="number"], select {
      padding: 8px 10px; border: 1px solid #cbd5e0;
      border-radius: 5px; font-size: 0.9rem; background: #fff;
    }
    input[type="text"]   { min-width: 120px; }
    input[type="number"] { width: 100px; }
    .btn-add {
      background: var(--primary); color: #fff; border: none;
      padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: 600;
    }
    .setup-table {
      width: 100%; border-collapse: collapse; font-size: 0.88rem;
    }
    .setup-table th, .setup-table td {
      border: 1px solid var(--border); padding: 7px 9px;
      text-align: left; vertical-align: middle;
    }
    .setup-table th { background: var(--sidebar); font-weight: 600; }
    .setup-table td input[type="text"],
    .setup-table td input[type="number"] {
      width: 100%; padding: 4px 6px; font-size: 0.85rem;
      border: 1px solid #a0aec0; border-radius: 4px; background: #fffde7;
    }
    .setup-table td select {
      width: 100%; padding: 4px 6px; font-size: 0.85rem;
      border: 1px solid #a0aec0; border-radius: 4px; background: #fffde7;
    }
    /* Farbpalette */
    .color-swatches {
      display: flex; flex-wrap: wrap; gap: 4px; min-width: 180px;
    }
    .color-swatch {
      width: 22px; height: 22px; border-radius: 4px;
      border: 2px solid transparent; cursor: pointer;
      transition: border-color 0.1s; flex-shrink: 0;
    }
    .color-swatch.selected {
      border-color: #2c3e50; box-shadow: 0 0 0 1px #fff inset;
    }
    .color-swatches-form {
      display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    }
    .color-swatch-form {
      width: 26px; height: 26px; border-radius: 5px;
      border: 2px solid transparent; cursor: pointer; transition: border-color 0.1s;
    }
    .color-swatch-form.selected {
      border-color: #2c3e50; box-shadow: 0 0 0 2px #fff inset;
    }
    /* Buttons Tabelle */
    .btn-edit {
      background: #3498db; color: #fff; border: none;
      padding: 4px 9px; border-radius: 4px;
      cursor: pointer; font-size: 0.8rem; font-weight: 600; margin-right: 4px;
    }
    .btn-save {
      background: var(--accent); color: #fff; border: none;
      padding: 4px 9px; border-radius: 4px;
      cursor: pointer; font-size: 0.8rem; font-weight: 600; margin-right: 4px;
    }
    .btn-del {
      background: none; border: none; color: #e53e3e;
      cursor: pointer; font-weight: 700; font-size: 0.9rem;
    }
    .btn-cancel-edit {
      background: #e2e8f0; border: none; color: #444;
      padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
    }
    /* Modal */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); justify-content: center;
      align-items: center; z-index: 1000;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: #fff; padding: 24px; border-radius: 12px;
      width: 95%; max-width: 440px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal-content h2 { margin-bottom: 12px; }
    .modal-total { font-size: 2rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
    .modal-content label { font-size: 0.85rem; color: #555; display: block; margin-bottom: 4px; }
    .modal-content input[type="number"] { width: 100%; font-size: 1.4rem; padding: 10px; margin-bottom: 12px; }
    .cash-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .cash-btn { padding: 12px 4px; font-size: 1rem; font-weight: 700; color: #fff; border: none; border-radius: 7px; cursor: pointer; }
    .btn-5e  { background: #79a1cb; }
    .btn-10e { background: #e67e22; }
    .btn-20e { background: #3498db; }
    .btn-50e { background: #f1c40f; color: #2c3e50; }
    .change-output {
      padding: 14px; background: #edf2f7; border-radius: 6px;
      font-size: 1.4rem; font-weight: 700;
      border-left: 5px solid var(--accent); margin-bottom: 16px;
    }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel { background: #e2e8f0; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-confirm { background: var(--accent); color: #fff; border: none; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1rem; }
    #toast {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2c3e50; color: #fff; padding: 10px 22px;
      border-radius: 20px; font-size: 0.9rem; opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; z-index: 2000;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <h1>&#9889; Kasse</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="pos">Kasse</button>
      <button class="tab-btn" data-tab="history">Historie</button>
      <button class="tab-btn" data-tab="setup">Einstellungen</button>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-export">&#128228;</button>
      <button class="icon-btn" id="btn-import">&#128229;</button>
      <input type="file" id="importFile" accept=".json" style="display:none" />
    </div>
  </header>

  <!-- KASSE -->
  <div id="pos-tab" class="tab-content active">
    <div class="sidebar" id="categories-list"></div>
    <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <div class="main-grid" id="items-grid"></div>
      <footer>
        <button class="btn-clear" id="btn-clear">&#128465; Leeren</button>
        <div class="total-box" id="total-display">Zwischensumme: 0,00 &#8364;</div>
      </footer>
    </div>
  </div>

  <!-- HISTORIE -->
  <div id="history-tab" class="tab-content">
    <h2>Bestellhistorie</h2>
    <div id="history-list"></div>
  </div>

  <!-- EINSTELLUNGEN -->
  <div id="setup-tab" class="tab-content">

    <div class="setup-section">
      <h2>Kategorien</h2>
      <div class="form-row">
        <input type="text" id="new-cat-name" placeholder="z.B. Softdrinks" />
        <button class="btn-add" id="btn-add-cat">Hinzuf&#252;gen</button>
      </div>
      <table class="setup-table">
        <thead><tr><th>Kategorie</th><th></th></tr></thead>
        <tbody id="setup-categories-table"></tbody>
      </table>
    </div>

    <div class="setup-section">
      <h2>Artikel verwalten</h2>
      <p style="font-size:0.8rem;color:#666;margin-bottom:10px;">
        Minusbetrag = R&#252;ckgabe. Kurz tippen = +1, lang halten = -1.
      </p>
      <div class="form-row">
        <select id="item-cat-select"></select>
        <input type="text"   id="item-name"  placeholder="Name" />
        <input type="number" id="item-price" step="0.01" placeholder="Preis (&#8364;)" />
        <input type="number" id="item-pfand" step="0.01" placeholder="Pfand (&#8364;)" value="0" />
        <div class="color-swatches-form" id="color-picker-form"></div>
        <button class="btn-add" id="btn-add-item">Hinzuf&#252;gen</button>
      </div>
      <table class="setup-table">
        <thead>
          <tr>
            <th>Kategorie</th><th>Name</th><th>Preis</th><th>Pfand</th><th>Farbe</th><th></th>
          </tr>
        </thead>
        <tbody id="setup-items-table"></tbody>
      </table>
    </div>

  </div>

  <!-- CHECKOUT MODAL -->
  <div class="modal" id="checkout-modal">
    <div class="modal-content">
      <h2>Abrechnung</h2>
      <div class="modal-total" id="modal-total-payable">0,00 &#8364;</div>
      <label>Gegeben (&#8364;)</label>
      <input type="number" id="amount-received" step="0.01" min="0" placeholder="0,00" />
      <div class="cash-presets">
        <button class="cash-btn btn-5e"  data-amount="5">5 &#8364;</button>
        <button class="cash-btn btn-10e" data-amount="10">10 &#8364;</button>
        <button class="cash-btn btn-20e" data-amount="20">20 &#8364;</button>
        <button class="cash-btn btn-50e" data-amount="50">50 &#8364;</button>
      </div>
      <div class="change-output">
        R&#252;ckgeld: <span id="change-display">0,00 &#8364;</span>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel"  id="btn-cancel-checkout">Abbrechen</button>
        <button class="btn-confirm" id="btn-confirm-checkout">&#10003; Abschlie&#223;en</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // FARBEN (20 Stueck)
    const COLORS = [
      { hex: "#ffffff", label: "Wei\u00df" },
      { hex: "#f0f0f0", label: "Hellgrau" },
      { hex: "#d6d6d6", label: "Grau" },
      { hex: "#ffe3e3", label: "Hellrot" },
      { hex: "#ff9999", label: "Rosa-Rot" },
      { hex: "#ffc5a1", label: "Lachs" },
      { hex: "#ffe0b2", label: "Pfirsich" },
      { hex: "#fff9c4", label: "Hellgelb" },
      { hex: "#fff3cd", label: "Creme" },
      { hex: "#e8f5e9", label: "Mintgr\u00fcn" },
      { hex: "#c8f7c5", label: "Gr\u00fcn" },
      { hex: "#b2dfdb", label: "T\u00fcrkis" },
      { hex: "#e3faf2", label: "Mint" },
      { hex: "#e8f4fd", label: "Hellblau" },
      { hex: "#b3d9f7", label: "Blau" },
      { hex: "#d1c4e9", label: "Lila" },
      { hex: "#e1bee7", label: "Violett" },
      { hex: "#f8bbd0", label: "Pink" },
      { hex: "#ffccbc", label: "Apricot" },
      { hex: "#dcedc8", label: "Lindgr\u00fcn" }
    ];

    // STATE
    const DEFAULT_DATA = {
      categories: ["Getr\u00e4nke", "Pfandr\u00fcckgabe"],
      items: [
        { id: 1, cat: "Getr\u00e4nke",       name: "Bier 0,33l",       price:  2.50, pfand: 0.08, color: "#ffffff" },
        { id: 2, cat: "Getr\u00e4nke",       name: "Cola / Fanta",     price:  2.00, pfand: 0.15, color: "#ffffff" },
        { id: 3, cat: "Pfandr\u00fcckgabe",  name: "Flasche zur\u00fcck", price: -0.08, pfand: 0.00, color: "#ffe3e3" }
      ],
      history: []
    };

    let appData        = JSON.parse(localStorage.getItem("kassenapp_data") || "null") || DEFAULT_DATA;
    let currentCart    = {};
    let activeCategory = appData.categories[0] || "";
    let editingItemId  = null;
    let formColor      = COLORS[0].hex;

    function saveData() { localStorage.setItem("kassenapp_data", JSON.stringify(appData)); }

    // TOAST
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    // TABS
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tab + "-tab").classList.add("active");
        btn.classList.add("active");
        if (tab === "pos")     renderPOS();
        if (tab === "setup")   renderSetup();
        if (tab === "history") renderHistory();
      });
    });

    // POS
    function renderPOS() {
      const catList = document.getElementById("categories-list");
      catList.innerHTML = "";
      appData.categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "category-btn" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat;
        btn.addEventListener("click", () => { activeCategory = cat; renderPOS(); });
        catList.appendChild(btn);
      });
      const grid = document.getElementById("items-grid");
      grid.innerHTML = "";
      appData.items.filter(i => i.cat === activeCategory).forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.style.backgroundColor = item.color || "#ffffff";
        const qty = currentCart[item.id] || 0;
        const nameEl = document.createElement("div");
        nameEl.className = "item-name"; nameEl.textContent = item.name;
        const priceEl = document.createElement("div");
        priceEl.className = "item-price";
        priceEl.textContent = item.price.toFixed(2) + " \u20ac" +
          (item.pfand > 0 ? " (+" + item.pfand.toFixed(2) + ")" : "");
        card.appendChild(nameEl); card.appendChild(priceEl);
        if (qty > 0) {
          const badge = document.createElement("div");
          badge.className = "item-badge"; badge.textContent = qty;
          card.appendChild(badge);
        }
        let pressTimer = null;
        const startPress = () => { pressTimer = setTimeout(() => { pressTimer = null; changeQty(item.id, -1); }, 550); };
        const endPress   = () => { if (pressTimer !== null) { clearTimeout(pressTimer); pressTimer = null; changeQty(item.id, 1); } };
        card.addEventListener("mousedown",  startPress);
        card.addEventListener("mouseup",    endPress);
        card.addEventListener("mouseleave", () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
        card.addEventListener("touchstart", e => { e.preventDefault(); startPress(); }, { passive: false });
        card.addEventListener("touchend",   e => { e.preventDefault(); endPress();   }, { passive: false });
        grid.appendChild(card);
      });
      updateTotalDisplay();
    }

    function changeQty(itemId, delta) {
      currentCart[itemId] = (currentCart[itemId] || 0) + delta;
      if (currentCart[itemId] <= 0) delete currentCart[itemId];
      renderPOS();
    }
    function calculateTotal() {
      return Object.keys(currentCart).reduce((sum, id) => {
        const item = appData.items.find(i => i.id == id);
        return sum + (item ? (item.price + item.pfand) * currentCart[id] : 0);
      }, 0);
    }
    function fmt(n) {
      return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " \u20ac";
    }
    function updateTotalDisplay() {
      document.getElementById("total-display").textContent = "Zwischensumme: " + fmt(calculateTotal());
    }
    document.getElementById("btn-clear").addEventListener("click", () => { currentCart = {}; renderPOS(); });
    document.getElementById("total-display").addEventListener("click", openCheckoutModal);

    // CHECKOUT
    function openCheckoutModal() {
      const total = calculateTotal();
      if (total === 0) { showToast("Warenkorb ist leer!"); return; }
      document.getElementById("modal-total-payable").textContent = fmt(total);
      document.getElementById("amount-received").value = "";
      document.getElementById("change-display").textContent = "0,00 \u20ac";
      document.getElementById("checkout-modal").classList.add("open");
    }
    function closeCheckoutModal() { document.getElementById("checkout-modal").classList.remove("open"); }
    document.getElementById("btn-cancel-checkout").addEventListener("click", closeCheckoutModal);
    document.querySelectorAll(".cash-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.getElementById("amount-received").value = btn.dataset.amount;
        calculateChange();
      });
    });
    document.getElementById("amount-received").addEventListener("input", calculateChange);
    function calculateChange() {
      const total    = calculateTotal();
      const received = parseFloat(document.getElementById("amount-received").value) || 0;
      document.getElementById("change-display").textContent = fmt(Math.max(0, received - total));
    }
    document.getElementById("btn-confirm-checkout").addEventListener("click", () => {
      const total    = calculateTotal();
      const received = parseFloat(document.getElementById("amount-received").value) || 0;
      const summary  = Object.keys(currentCart).map(id => {
        const item = appData.items.find(i => i.id == id);
        return currentCart[id] + "x " + item.name;
      }).join(", ");
      appData.history.unshift({ timestamp: new Date().toLocaleString("de-DE"), items: summary, total, received, change: Math.max(0, received - total) });
      saveData(); currentCart = {}; closeCheckoutModal(); renderPOS();
      showToast("\u2705 Buchung gespeichert!");
    });

    // HISTORY
    function renderHistory() {
      const container = document.getElementById("history-list");
      if (appData.history.length === 0) {
        container.innerHTML = "<p style='color:#888;'>Noch keine Buchungen vorhanden.</p>"; return;
      }
      container.innerHTML = "";
      appData.history.forEach(tx => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML =
          "<strong>\uD83D\uDCC5 " + tx.timestamp + " \u2014 " + fmt(tx.total) + "</strong>" +
          "<div style='margin:4px 0'>" + tx.items + "</div>" +
          "<small>Gegeben: " + fmt(tx.received) + " | R\u00fcckgeld: " + fmt(tx.change) + "</small>";
        container.appendChild(div);
      });
    }

    // FARB-SWATCHES
    function buildSwatchesForm(containerId, selectedColor, onSelect) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      COLORS.forEach(c => {
        const sw = document.createElement("div");
        sw.className = "color-swatch-form" + (c.hex === selectedColor ? " selected" : "");
        sw.style.backgroundColor = c.hex;
        sw.title = c.label;
        sw.addEventListener("click", () => {
          container.querySelectorAll(".color-swatch-form").forEach(s => s.classList.remove("selected"));
          sw.classList.add("selected");
          onSelect(c.hex);
        });
        container.appendChild(sw);
      });
    }

    function buildSwatchesInline(container, selectedColor) {
      container.innerHTML = "";
      COLORS.forEach(c => {
        const sw = document.createElement("div");
        sw.className = "color-swatch" + (c.hex === selectedColor ? " selected" : "");
        sw.style.backgroundColor = c.hex;
        sw.title = c.label;
        sw.dataset.color = c.hex;
        sw.addEventListener("click", () => {
          container.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
          sw.classList.add("selected");
        });
        container.appendChild(sw);
      });
    }

    // SETUP
    function renderSetup() {
      const sel = document.getElementById("item-cat-select");
      sel.innerHTML = "";
      appData.categories.forEach(c => {
        const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o);
      });
      buildSwatchesForm("color-picker-form", formColor, hex => { formColor = hex; });

      const catTbl = document.getElementById("setup-categories-table");
      catTbl.innerHTML = "";
      appData.categories.forEach((c, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = "<td>" + escHtml(c) + "</td><td><button class='btn-del' data-ci='" + i + "'>L\u00f6schen</button></td>";
        catTbl.appendChild(tr);
      });
      catTbl.querySelectorAll(".btn-del").forEach(btn => {
        btn.addEventListener("click", () => deleteCategory(+btn.dataset.ci));
      });

      renderItemsTable();
    }

    function renderItemsTable() {
      const itemTbl = document.getElementById("setup-items-table");
      itemTbl.innerHTML = "";

      appData.items.forEach(item => {
        const tr = document.createElement("tr");
        tr.dataset.id = item.id;

        if (editingItemId === item.id) {
          // EDIT-ZEILE
          const catOptions = appData.categories.map(c =>
            "<option value='" + escHtml(c) + "'" + (c === item.cat ? " selected" : "") + ">" + escHtml(c) + "</option>"
          ).join("");

          tr.innerHTML =
            "<td><select class='edit-cat'>" + catOptions + "</select></td>" +
            "<td><input type='text' class='edit-name' value='" + escAttr(item.name) + "' /></td>" +
            "<td><input type='number' class='edit-price' step='0.01' value='" + item.price.toFixed(2) + "' /></td>" +
            "<td><input type='number' class='edit-pfand' step='0.01' value='" + item.pfand.toFixed(2) + "' /></td>" +
            "<td><div class='color-swatches' id='edit-sw-" + item.id + "'></div></td>" +
            "<td>" +
              "<button class='btn-save'>Speichern</button>" +
              "<button class='btn-cancel-edit'>Abbrechen</button>" +
            "</td>";

          itemTbl.appendChild(tr);
          buildSwatchesInline(document.getElementById("edit-sw-" + item.id), item.color);

          tr.querySelector(".btn-save").addEventListener("click", () => {
            const newCat   = tr.querySelector(".edit-cat").value;
            const newName  = tr.querySelector(".edit-name").value.trim();
            const newPrice = parseFloat(tr.querySelector(".edit-price").value) || 0;
            const newPfand = parseFloat(tr.querySelector(".edit-pfand").value) || 0;
            const selSw    = tr.querySelector(".color-swatch.selected");
            const newColor = selSw ? selSw.dataset.color : item.color;
            if (!newName) { showToast("Name darf nicht leer sein!"); return; }
            const idx = appData.items.findIndex(i => i.id === item.id);
            if (idx !== -1) appData.items[idx] = { ...appData.items[idx], cat: newCat, name: newName, price: newPrice, pfand: newPfand, color: newColor };
            editingItemId = null;
            saveData(); renderItemsTable();
            showToast("\u2705 Gespeichert!");
          });

          tr.querySelector(".btn-cancel-edit").addEventListener("click", () => {
            editingItemId = null; renderItemsTable();
          });

        } else {
          // NORMAL-ZEILE
          tr.style.backgroundColor = item.color;
          const dot = "<div style='width:20px;height:20px;border-radius:4px;background:" + item.color + ";border:1px solid #ccc;display:inline-block;vertical-align:middle;'></div>";
          tr.innerHTML =
            "<td>" + escHtml(item.cat)  + "</td>" +
            "<td>" + escHtml(item.name) + "</td>" +
            "<td>" + item.price.toFixed(2) + " \u20ac</td>" +
            "<td>" + item.pfand.toFixed(2) + " \u20ac</td>" +
            "<td>" + dot + "</td>" +
            "<td>" +
              "<button class='btn-edit'>\u270f\ufe0f Bearbeiten</button>" +
              "<button class='btn-del'>L\u00f6schen</button>" +
            "</td>";

          tr.querySelector(".btn-edit").addEventListener("click", () => {
            editingItemId = item.id; renderItemsTable();
          });
          tr.querySelector(".btn-del").addEventListener("click", () => {
            const idx = appData.items.findIndex(i => i.id === item.id);
            if (idx !== -1) appData.items.splice(idx, 1);
            if (editingItemId === item.id) editingItemId = null;
            saveData(); renderItemsTable();
          });

          itemTbl.appendChild(tr);
        }
      });
    }

    function escHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function escAttr(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // KATEGORIE
    document.getElementById("btn-add-cat").addEventListener("click", () => {
      const name = document.getElementById("new-cat-name").value.trim();
      if (name && !appData.categories.includes(name)) {
        appData.categories.push(name); saveData(); renderSetup();
        document.getElementById("new-cat-name").value = "";
      }
    });
    function deleteCategory(i) {
      const name = appData.categories[i];
      appData.categories.splice(i, 1);
      appData.items = appData.items.filter(item => item.cat !== name);
      if (activeCategory === name) activeCategory = appData.categories[0] || "";
      saveData(); renderSetup();
    }

    // ARTIKEL HINZUFUEGEN
    document.getElementById("btn-add-item").addEventListener("click", () => {
      const cat   = document.getElementById("item-cat-select").value;
      const name  = document.getElementById("item-name").value.trim();
      const price = parseFloat(document.getElementById("item-price").value) || 0;
      const pfand = parseFloat(document.getElementById("item-pfand").value) || 0;
      if (cat && name) {
        appData.items.push({ id: Date.now(), cat, name, price, pfand, color: formColor });
        saveData(); renderSetup();
        document.getElementById("item-name").value  = "";
        document.getElementById("item-price").value = "";
        document.getElementById("item-pfand").value = "0";
        showToast("Artikel hinzugef\u00fcgt!");
      }
    });

    // EXPORT / IMPORT
    document.getElementById("btn-export").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = "kassenapp_" + new Date().toISOString().slice(0,10) + ".json";
      a.click(); URL.revokeObjectURL(url);
    });
    document.getElementById("btn-import").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.categories && parsed.items) {
            appData = parsed; activeCategory = appData.categories[0] || "";
            saveData(); currentCart = {}; renderPOS(); showToast("Import erfolgreich!");
          } else { showToast("Ung\u00fcltige Datei!"); }
        } catch { showToast("Fehler beim Laden!"); }
      };
      reader.readAsText(file); e.target.value = "";
    });

    // SERVICE WORKER
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
    }

    // INIT
    renderPOS();
  </script>
</body>
</html>
